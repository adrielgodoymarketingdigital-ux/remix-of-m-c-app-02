    <!-- UTMify Pixel Code -->
    <script>
      // UTMify SÓ nas páginas do funil do MecApp (landing, LPs, cadastro/checkout,
      // obrigado, renovação). No app logado e no login o pixel "preenchia" todo
      // campo de e-mail com o lead guardado no navegador (apagava/trocava o
      // e-mail) e capturava e-mails/telefones digitados. Também fica FORA das
      // páginas públicas das lojas (/c, /lp/:slug, /acompanhar, /acompanhar-cliente,
      // /entrada): quem as visita é cliente do lojista, não lead do MecApp.
      // Esta lista é a fonte única: o app lê window.__mecUtmify
      // (src/components/GuardaUtmify.tsx) para a navegação sem recarregar.
      window.__mecUtmify = {
        exatas: ["/", "/lp1", "/lp2", "/es", "/cadastro-plano", "/completar-cadastro", "/obrigado", "/cadastro-trial", "/ativar-trial", "/renovar"],
        prefixos: [],
        carregado: false,
        ehRotaPublica: function (caminho) {
          var p = caminho.length > 1 ? caminho.replace(/\/+$/, "") : caminho;
          if (this.exatas.indexOf(p) !== -1) return true;
          for (var i = 0; i < this.prefixos.length; i++) {
            if (p.indexOf(this.prefixos[i]) === 0) return true;
          }
          return false;
        },
        carregar: function () {
          if (this.carregado) return;
          this.carregado = true;
          window.pixelId = "69389ff6e59dc06089d47ffb";
          var a = document.createElement("script");
          a.setAttribute("async", "");
          a.setAttribute("defer", "");
          a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
          document.head.appendChild(a);
        },
      };
      if (window.__mecUtmify.ehRotaPublica(window.location.pathname)) window.__mecUtmify.carregar();
    </script>
    <!-- End UTMify Pixel Code -->

    <!-- Tracking Params Capture (Meta CAPI + UTM) -->
    <script>
      (function() {
        // Helper para ler cookie
        function getCookie(name) {
          try {
            var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match && match[2] ? decodeURIComponent(match[2]) : null;
          } catch(e) {
            return null;
          }
        }
        
        // Helper para escrever cookie
        function setCookie(name, value, days) {
          var expires = '';
          if (days) {
            var date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = '; expires=' + date.toUTCString();
          }
          document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/; SameSite=Lax';
        }
        
        // Capturar parâmetros da URL no carregamento
        var initialParams = new URLSearchParams(window.location.search);
        var keys = ['fbclid', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
        
        keys.forEach(function(key) {
          var value = initialParams.get(key);
          if (value) {
            localStorage.setItem('tracking_' + key, value);
          }
        });
        
        // Gerar _fbc a partir do fbclid (formato oficial do Facebook: fb.{subdomain}.{timestamp}.{fbclid})
        var fbclid = initialParams.get('fbclid') || localStorage.getItem('tracking_fbclid');
        if (fbclid) {
          var existingFbc = getCookie('_fbc');
          if (!existingFbc) {
            var fbc = 'fb.1.' + Date.now() + '.' + fbclid;
            setCookie('_fbc', fbc, 90);
          }
        }
      })();
    </script>
